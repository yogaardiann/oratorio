services:
  # --- Database MySQL ---
  db:
    image: mysql:8.0
    container_name: oratorio_db
    restart: always
    environment:
      MYSQL_DATABASE: oratorio
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Flask Backend ---
  backend:
    build: ./backend
    container_name: oratorio_backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=oratorio
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000" # Wajib agar React di luar Docker bisa "nembak" ke sini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure:5
    volumes:
      - ./backend/static/uploads:/app/static/uploads

  # --- NGINX REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: oratorio_proxy
    ports:
      - "8080:80"   # host:8080 → container:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: on-failure
    # Flutter & React akan akses ke http://localhost:8080 → di-tunnel ngrok
    extra_hosts:
      host.docker.internal: host-gateway

  # --- Redis OTP ---
  redis:
    image: redis:7-alpine
    container_name: oratorio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
    depends_on:
      - backend
    restart: on-failure
    # Flutter & React akan akses ke http://localhost:8080 → di-tunnel ngrok
    extra_hosts:
      host.docker.internal: host-gateway

  # --- Redis OTP ---
  redis:
    image: redis:7-alpine
    container_name: oratorio_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data: