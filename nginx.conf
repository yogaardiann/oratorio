events {
    worker_connections 1024;
}

http {
    # Optimasi
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Proxy Settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;  # ← Penting untuk HTTPS detection

    server {
        listen 80;
        server_name localhost;

        # 🌐 ROOT: React Web (host:3000)
        location / {
            proxy_pass http://host.docker.internal:3000;  # ← Akses host dari dalam Docker
            proxy_http_version 1.1;
        }

        # 📦 Static Uploads (dari Flask container)
        location /static/uploads/ {
            proxy_pass http://backend:5000/static/uploads/;
            # Atau lebih aman: langsung serve dari volume
            # alias /app/static/uploads/;
            # expires 1y;
        }

        # 🧠 API Backend (Flask)
        location /api/ {
            proxy_pass http://backend:5000/api/;
        }

        # 💡 Health check
        location /health {
            proxy_pass http://backend:5000/health;
        }
    }
}